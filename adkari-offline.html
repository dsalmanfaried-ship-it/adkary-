<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>أذكاري</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أذكاري">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<style>
:root{--bg:#000;--tx:#ececec;--mu:#8a8a8a;--tr:#1c1c1c;--ar:#9b9b9b;--g:#22a85a;--cd:#12231a;--cd2:#1a3125;--ov:#262626;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f5f7f4;--tx:#151515;--mu:#6b6b6b;--tr:#dcdcdc;--ar:#6c6c6c;--cd:#e1efe6;--cd2:#cfe6d9;--ov:#fff;color-scheme:light}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;overscroll-behavior:none}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Amiri','Scheherazade New','Noto Naskh Arabic','Traditional Arabic','Geeza Pro','Damascus',serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{position:relative;height:100%;max-width:520px;margin:auto}
.s{position:absolute;inset:0;display:none;flex-direction:column}
.s.on{display:flex;animation:sin .28s ease-out}
@keyframes sin{from{opacity:0;transform:translateY(10px)}}
.ui{font-family:'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
/* home */
#hm{padding:18px 16px;overflow:auto}
#hm h1{margin:6px 0 0;text-align:center;font:800 24px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
#bis{text-align:center;color:var(--g);font-size:30px;margin-top:14px}
#dt{text-align:center;color:var(--mu);font:500 12px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;margin:4px 0 18px}
.card{background:var(--cd);border-radius:22px;padding:16px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hd .ic{width:42px;height:42px;border-radius:50%;background:var(--cd2);display:grid;place-items:center;color:#e8b84a}
.hd b{font:800 22px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;display:block}
.hd small{color:var(--mu);font:500 12px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
.hd .pc{margin-inline-start:auto;position:relative;width:46px;height:46px}
.pc svg{transform:rotate(-90deg)}
.pc span{position:absolute;inset:0;display:grid;place-items:center;font:800 11px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;color:var(--g)}
.list{background:var(--cd2);border-radius:18px;padding:4px 14px}
.row{display:block;width:100%;text-align:start;padding:14px 0;border-bottom:1px solid rgba(128,128,128,.14)}
.row:last-child{border:0}
.row{transition:transform .12s}.row:active{transform:scale(.98)}
.rt{display:flex;align-items:center;gap:10px;font:800 16px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
.rt svg{color:var(--mu);flex:none}
.rt .go{margin-inline-start:auto;background:var(--g);color:#04210f;border-radius:999px;padding:4px 12px;font-size:12px}
.rt .cv{margin-inline-start:auto;width:18px;height:18px}
.rs{color:var(--mu);font:500 12px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;margin:4px 0 0 0;padding-inline-start:34px}
.bar2{height:4px;border-radius:4px;background:rgba(128,128,128,.25);margin:8px 0 0;margin-inline-start:34px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--g);border-radius:4px;transition:width .5s}
/* reader */
.top{direction:rtl;display:flex;align-items:center;padding:10px 12px;color:var(--mu)}
.top button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.top button:active{background:var(--tr)}
.top .sp{flex:1}
#cnt{text-align:center;color:var(--mu);font:500 13px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;padding-bottom:6px}
#seg{display:flex;gap:3px;padding:0 6px}
#seg i{flex:1;height:5px;border-radius:3px;background:var(--tr);cursor:pointer;transition:background .3s}
#seg i.d{background:var(--ar)}
#seg i.c{background:var(--mu)}
#tw{flex:1;overflow:auto;display:flex;padding:18px 22px}
#tx{margin:auto;text-align:center;will-change:transform,opacity}
#t{margin:0;font-weight:700;line-height:1.95;font-size:calc(var(--fs,27px)*var(--sc,1))}
#f{margin:14px 0 0;color:var(--mu);font-size:15px;line-height:1.7}
#ring{--rs:clamp(120px,24vh,250px);position:relative;width:var(--rs);height:var(--rs);margin:0;flex:none;color:var(--tx)}
#ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:9;stroke-linecap:round}
#arc{stroke:var(--ar);transition:stroke-dashoffset .18s cubic-bezier(.3,.7,.3,1)}
#trk{stroke:var(--tr)}
#num{position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--rs)*.35) 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
#num.pop{animation:pop .18s}
@keyframes pop{50%{transform:scale(1.18)}}
#num svg{width:calc(var(--rs)*.4);height:calc(var(--rs)*.4);stroke:var(--mu);stroke-width:2.2}
#ring{transition:transform .12s}#ring.pr{transform:scale(.94)}#ring.pr #trk{stroke:var(--ar);opacity:.5}#rd{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#nav{display:flex;align-items:center;justify-content:center;gap:clamp(14px,6vw,36px);margin:6px 0 12px;flex:none}
.nb{width:52px;height:52px;border-radius:50%;background:var(--cd2);border:1.5px solid var(--g);color:var(--tx);display:grid;place-items:center;flex:none;transition:transform .12s,opacity .2s}
.nb:active{transform:scale(.9)}.nb:disabled{opacity:.3;pointer-events:none;border-color:var(--tr)}
@media(min-width:700px){.nb{width:60px;height:60px}}
#nx{padding:4px 18px 14px;text-align:center;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dialog + toast */
#dl{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:5}
#dl.on{display:grid}
.dc{background:var(--ov);width:min(86%,330px);border-radius:24px;padding:26px 20px 18px;text-align:center;animation:up .3s;position:relative;overflow:hidden}
@keyframes up{from{transform:scale(.9);opacity:0}}
.ck{width:56px;height:56px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin:0 auto 14px;color:#fff;animation:pop .5s .15s both}
.ck svg{width:32px;height:32px;stroke-width:3}
.dc h2{margin:0 0 8px;font:800 22px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
.dc p{margin:0 0 18px;color:var(--mu);font:500 14px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
.dc .b{display:flex;justify-content:center;align-items:center;gap:22px;font:800 15px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif}
.dc .ok{background:var(--g);color:#04210f;border-radius:12px;padding:10px 26px}
.cf i{position:absolute;width:7px;height:7px;border-radius:2px;top:40px;left:50%;animation:cf 1.1s ease-out both}
@keyframes cf{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(300deg);opacity:0}}
#ts{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ov);color:var(--tx);padding:8px 16px;border-radius:999px;font:500 13px 'Tajawal','Noto Sans Arabic','Segoe UI','Geeza Pro',Tahoma,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
#ts.on{opacity:1}
body{touch-action:manipulation;-webkit-touch-callout:none}
.rp{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:var(--g);opacity:.26;pointer-events:none;animation:rp .5s ease-out forwards}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
@media(min-width:700px){:root{--sc:1.5}#app{max-width:820px}#hm{padding:30px 40px}.card{padding:26px}.rt{font-size:21px}.rs{font-size:15px}.hd b{font-size:30px}.hd small{font-size:15px}.hd .ic{width:54px;height:54px}#cnt{font-size:17px}.top button{width:52px;height:52px}#nx{font-size:17px}#f{font-size:22px}#hm h1{font-size:32px}#bis{font-size:40px}#dt{font-size:15px}#seg i{height:7px}.dc{width:420px}}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rp{display:none}}
</style>
</head>
<body>
<div id="app">
 <div id="hm" class="s on">
  <h1>أذكاري</h1>
  <div id="bis">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  <div id="dt"></div>
  <div class="card">
   <div class="hd"><div class="ic" id="gi"></div><div><b id="gt"></b><small id="gs"></small></div><div class="pc"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="4"/><circle id="pa" cx="23" cy="23" r="19" fill="none" stroke="#22a85a" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" style="transition:stroke-dashoffset .6s"/></svg><span id="pp"></span></div></div>
   <div class="list" id="ls"></div>
  </div>
 </div>
 <div id="rd" class="s">
  <div class="top"><button id="bk" aria-label="رجوع"></button><span class="sp"></span><button id="un" aria-label="إعادة العدّاد"></button><button id="th" aria-label="الوضع"></button><button id="st" aria-label="حجم الخط"></button></div>
  <div id="cnt"></div><div id="seg"></div>
  <div id="tw"><div id="tx"><p id="t"></p><p id="f"></p></div></div>
  <div id="nav"><button class="nb" id="pv" aria-label="السابق"></button><button id="ring" aria-label="سبّح"><svg viewBox="0 0 150 150"><circle id="trk" cx="75" cy="75" r="68"/><circle id="arc" cx="75" cy="75" r="68" stroke-dasharray="427.3" stroke-dashoffset="427.3"/></svg><div id="num"></div></button><button class="nb" id="nxb" aria-label="التالي"></button></div>
  <div id="nx"></div>
 </div>
 <div id="dl"><div class="dc"><div class="cf" id="cf"></div><div class="ck" id="dk"></div><h2>تقبّل الله منك</h2><p id="dm"></p><div class="b"><button id="ud">تراجع</button><button class="ok" id="dn">تم</button></div></div></div>
 <div id="ts"></div>
</div>
<script>
const $=s=>document.querySelector(s),ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const sv=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={bk:sv('<path d="M5 12h14m-6-6 6 6-6 6"/>'),un:sv('<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>'),mo:sv('<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'),st:sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>'),sun:sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>'),ck:sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),cv:sv('<path d="m15 6-6 6 6 6"/>'),bk2:sv('<path d="M4 5h16v14H4zM8 9h8M8 13h8"/>')};
const o=(t,c=1,f='',e)=>({t,c,f,e});
const KU='اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ';
const SU='قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ';
const M=[
o(KU,1,'من قالها حين يصبح أُجير من الجن حتى يمسي، ومن قالها حين يمسي أُجير حتى يصبح'),
o(SU,3,'من قالها حين يصبح وحين يمسي كفته من كل شيء'),
o('أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ'),
o('اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',1,'',"اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ"),
o('اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',1,'سيد الاستغفار — من قاله موقنًا به فمات من يومه أو ليلته دخل الجنة'),
o('اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ',4,'من قالها أعتقه الله من النار'),
o('اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ',3),
o('حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ',7,'كفاه الله ما أهمّه من أمر الدنيا والآخرة'),
o('بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',3,'لم يضرّه شيء'),
o('رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيًّا',3,'كان حقًّا على الله أن يرضيه'),
o('يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ'),
o('لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ',10),

o('اللَّهُمَّ يَا مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ',1,'رواه مسلم'),
o('رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ',1,'آل عمران ٨'),
o('رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ',10,'كان النبي ﷺ يقولها في المجلس مئة مرة')];
const C={
m:{n:'أذكار الصباح',l:MM,ic:IC.sun,d:'لا تنسَ أذكار المساء'},
e:{n:'أذكار المساء',l:E,ic:IC.mo,d:'لا تنسَ أذكار النوم'},
s:{n:'أذكار النوم',l:S,ic:IC.mo,d:'نامَ قريرَ العين، وبارك الله لك في يومك'},
d:{n:'أدعية الطالب',l:D,ic:IC.bk2,d:'بالتوفيق في المذاكرة والامتحانات'},
h:{n:'تزكية القلب والبعد عن الذنوب',l:H,ic:IC.ck,d:'ثبّت الله قلبك على طاعته'}};
const K=Object.keys(C),day=()=>new Date().toDateString();
let st=(()=>{try{const s=JSON.parse(localStorage.getItem('adk1'));if(s&&s.d===day())return s}catch(e){}return{d:day(),p:{},fs:27}})();
let svT=0;const flushSave=()=>{clearTimeout(svT);svT=0;try{localStorage.setItem('adk1',JSON.stringify(st))}catch(e){}};
const save=()=>{if(!svT)svT=setTimeout(flushSave,400)};
addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
let toastT;const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1400)};
const cnt=(k,j)=>(st.p[k]||[])[j]||0,setc=(k,j,v)=>{(st.p[k]=st.p[k]||[])[j]=v;save()};
const doneN=k=>C[k].l.filter((x,j)=>cnt(k,j)>=x.c).length;
function home(){
 const h=new Date().getHours();
 $('#gt').textContent=h<12?'صباح الخير':h<18?'نهارك سعيد':'مساء الخير';
 $('#gi').innerHTML=h>=18||h<4?IC.mo:IC.sun;
 const pref=h<12?'m':h<20?'e':'s';
 const rec=[pref,...K].find(k=>doneN(k)<C[k].l.length);
 let fin=0;
 $('#ls').innerHTML=K.map(k=>{const n=C[k].l.length,d=doneN(k);if(d===n)fin++;
  return `<button class="row" data-k="${k}"><div class="rt">${C[k].ic}<span>${C[k].n}</span>${k===rec?'<span class="go">ابدأ الآن</span>':'<span class="cv">'+IC.cv+'</span>'}</div><div class="rs">${ar(d)} من ${ar(n)}</div><div class="bar2"><i style="width:${d/n*100}%"></i></div></button>`}).join('');
 $('#gs').textContent=`يومك بنظرة سريعة، أنجزت ${ar(fin)} من ${ar(K.length)}`;
 const pc=Math.round(fin/K.length*100);$('#pp').textContent=ar(pc)+'٪';
 setTimeout(()=>$('#pa').style.strokeDashoffset=119.4*(1-pc/100),50);
 $('#ls').querySelectorAll('.row').forEach(b=>b.onclick=()=>open(b.dataset.k));
}
try{
 const hj=new Intl.DateTimeFormat('ar-EG-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
 const gr=new Intl.DateTimeFormat('ar-EG',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
 $('#dt').textContent=hj+' • '+gr;
}catch(e){}
let cat,i,L;
function open(k){cat=k;L=C[k].l;const ps=st.pos&&st.pos[k];i=Number.isInteger(ps)&&ps>=0&&ps<L.length?ps:L.findIndex((x,j)=>cnt(k,j)<x.c);if(i<0)i=0;$('#hm').classList.remove('on');$('#rd').classList.add('on');paint(false)}
let nt,ptT;
function txt(){const x=L[i];$('#t').innerHTML=x.t.replace(/\n/g,'<br><br>');$('#f').textContent=x.f;$('#tw').scrollTop=0}
let sw=0;
function resetTx(){sw=0;const x=$('#tx');x.style.transition='none';x.style.transform='';x.style.opacity=''}
function flush(){if(sw){clearTimeout(ptT);txt();resetTx()}}
function swapText(dir){const x=$('#tx');clearTimeout(ptT);sw=1;
 x.style.transition='transform .11s ease-in,opacity .11s';x.style.transform=`translate3d(${-dir*110}px,0,0)`;x.style.opacity='0';
 ptT=setTimeout(()=>{sw=0;txt();x.style.transition='none';x.style.transform=`translate3d(${dir*70}px,0,0)`;void x.offsetWidth;x.style.transition='transform .24s cubic-bezier(.2,.85,.25,1),opacity .24s';x.style.transform='';x.style.opacity=''},110)}
function paint(anim=true,dir=1){
 clearTimeout(nt);(st.pos=st.pos||{})[cat]=i;save();$('#pv').disabled=i<=0;$('#nxb').disabled=i>=L.length-1;
 $('#cnt').textContent=`${ar(i+1)} من ${ar(L.length)}`;
 const sg=$('#seg');if(sg.children.length!==L.length||sg.dataset.k!==cat){sg.dataset.k=cat;sg.innerHTML=L.map((y,j)=>`<i data-j="${j}"></i>`).join('')}
 for(let j=0;j<L.length;j++)sg.children[j].className=cnt(cat,j)>=L[j].c?'d':j===i?'c':'';
 $('#nx').textContent=i<L.length-1?'التالي: '+L[i+1].t.replace(/\n/g,' '):'آخر ذكر في هذه القائمة';
 ring(true);clearTimeout(ptT);
 if(anim)swapText(dir);else{resetTx();txt()}
}
function ring(jump){
 const x=L[i],d=cnt(cat,i),r=x.c-d,a=$('#arc');
 if(jump){a.style.transition='none'}
 a.style.strokeDashoffset=427.3*(1-Math.min(d/x.c,1));
 if(jump){void a.getBoundingClientRect();a.style.transition=''}
 $('#num').innerHTML=r<=0?IC.ck:ar(r);
}
function tap(px,py){
 const x=L[i],d=cnt(cat,i);
 if(px!==undefined){const r=rd.getBoundingClientRect(),p=document.createElement('div');p.className='rp';p.style.left=px-r.left+'px';p.style.top=py-r.top+'px';rd.appendChild(p);setTimeout(()=>p.remove(),600)}
 if(d>=x.c){return next()}
 setc(cat,i,d+1);ring();
 const n=$('#num');n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop');
 const sg=$('#seg').children[i];if(sg)sg.className=d+1>=x.c?'d':'c';
 if(d+1>=x.c){try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}clearTimeout(nt);nt=setTimeout(next,220)}else vib();
}
function next(){
 clearTimeout(nt);
 if(i<L.length-1){i++;paint(true,1)}
 else if(L.every((y,q)=>cnt(cat,q)>=y.c)){finish()}
 else{i=L.findIndex((y,q)=>cnt(cat,q)<y.c);paint()}
}
const prev=()=>{if(i>0){i--;paint(true,-1)}};
function finish(){
 $('#dk').innerHTML=IC.ck;$('#dm').textContent=C[cat].d;
 $('#cf').innerHTML=Array.from({length:12},(_,q)=>{const a=q/12*6.28,r=70+Math.random()*30;return `<i style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;background:${['#22a85a','#e8b84a','#3b9ae1','#e05a7a'][q%4]}"></i>`}).join('');
 $('#dl').classList.add('on');
}
$('#dn').onclick=()=>{$('#dl').classList.remove('on');back()};
$('#ud').onclick=()=>{$('#dl').classList.remove('on');const x=L[L.length-1];setc(cat,L.length-1,x.c-1);i=L.length-1;paint()};
function back(){$('#rd').classList.remove('on');$('#hm').classList.add('on');home()}
$('#bk').innerHTML=IC.bk;$('#un').innerHTML=IC.un;$('#th').innerHTML=IC.mo;$('#st').innerHTML=IC.st;
$('#bk').onclick=back;
$('#pv').innerHTML=IC.bk;$('#nxb').innerHTML=sv('<path d="M19 12H5m6-6-6 6 6 6"/>');
$('#pv').onclick=()=>{clearTimeout(nt);prev()};
$('#nxb').onclick=()=>{clearTimeout(nt);if(i<L.length-1){i++;paint(true,1)}};
$('#un').onclick=()=>{setc(cat,i,0);paint(false);toast('تمت إعادة العدّاد')};
const FS=[23,27,31,36];
const applyFs=()=>document.documentElement.style.setProperty('--fs',st.fs+'px');
$('#st').onclick=()=>{st.fs=FS[(FS.indexOf(st.fs)+1)%FS.length]||27;save();applyFs();toast('تم تغيير حجم الخط')};
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('adk-th',t)}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#000000':'#f5f7f4'}
try{theme(localStorage.getItem('adk-th')||'dark')}catch(e){theme('dark')}
$('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let P=null;const rd=$('#rd'),rel=()=>$('#ring').classList.remove('pr');
const tr=()=>$('#tx');let raf=0;
$('#seg').addEventListener('click',e=>{const q=e.target.closest('i');if(!q)return;const n=+q.dataset.j;if(n===i)return;const d=n>i?1:-1;i=n;paint(true,d)});
const draw=()=>{raf=0;if(!P||!P.lock)return;const x=tr();x.style.transform=`translate3d(${P.o}px,0,0)`;x.style.opacity=String(1-Math.min(Math.abs(P.o)/320,.55))};
const stop=()=>{if(raf){cancelAnimationFrame(raf);raf=0}};
const spring=()=>{stop();const x=tr();x.style.transition='transform .26s cubic-bezier(.2,.85,.25,1),opacity .26s';x.style.transform='';x.style.opacity=''};
rd.addEventListener('pointerdown',e=>{if(e.target.closest('.top,#seg,.nb'))return;if(e.pointerType==='mouse'&&e.button!==0)return;const n=performance.now();P={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,lt:n,v:0,lock:0,o:0};$('#ring').classList.add('pr')});
rd.addEventListener('pointermove',e=>{
 if(!P||e.pointerId!==P.id)return;
 const dx=e.clientX-P.x,dy=e.clientY-P.y,n=performance.now();
 if(!P.lock){
  if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){flush();P.lock=1;rel();try{rd.setPointerCapture(e.pointerId)}catch(_){}tr().style.transition='none'}
  else return}
 P.v=.7*(e.clientX-P.lx)/Math.max(n-P.lt,1)+.3*P.v;P.lx=e.clientX;P.lt=n;
 const ok=dx<0?i<L.length-1:i>0;P.o=dx*(ok?.95:.25);
 if(!raf)raf=requestAnimationFrame(draw)});
rd.addEventListener('pointercancel',()=>{if(P&&P.lock)spring();P=null;rel()});
rd.addEventListener('pointerup',e=>{rel();if(!P||e.pointerId!==P.id)return;const p=P;P=null;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(p.lock){stop();const dir=dx<0?1:-1,n=i+dir,v=performance.now()-p.lt>90?0:Math.abs(p.v);
  if(n>=0&&n<L.length&&(Math.abs(dx)>60||(v>.35&&Math.abs(dx)>20))){i=n;vib();paint(true,dir)}else spring();return}
 if(Math.abs(dx)<12&&Math.abs(dy)<12)tap(e.clientX,e.clientY)});
document.addEventListener('keydown',e=>{if(!$('#rd').classList.contains('on'))return;if((e.key===' '||e.key==='Enter')&&!e.target.closest('.top')){e.preventDefault();tap()}if(e.key==='ArrowLeft'){i<L.length-1&&(i++,paint(true,1))}if(e.key==='ArrowRight')prev()});
applyFs();home();

</script>
</body>
</html>
